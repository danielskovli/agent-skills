name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Skill frontmatter and names
        run: ruby scripts/check-skills.rb
      - name: Plugin and marketplace manifests
        run: npx --yes @anthropic-ai/claude-code@2.1.329 plugin validate .
